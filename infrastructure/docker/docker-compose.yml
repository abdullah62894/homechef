name: homechef

services:
  postgres:
    image: postgres:17
    container_name: homechef-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: homechef_dev_pw
      POSTGRES_DB: homechef
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homechef"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: